[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trueagent"
version = "1.0.0"
authors = [
  { name="ATP0925" },
]
description = "Universal AI Agent Enhancement Framework: WebPilot, VoxCore, SentinelGuard, and ReviewForge."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "requests>=2.25.0",
    "edge-tts>=6.1.0",
    "gTTS>=2.5.0",
]

[project.scripts]
trueagent = "trueagent_cli:main"

[tool.setuptools]
py-modules = ["trueagent_cli", "setup_trueagent"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
